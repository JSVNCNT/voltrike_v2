name: voltrike_v2
description: "VolTrike - Clean Community Mobility"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ===========================================================================
  # Firebase
  # ===========================================================================

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_database: ^12.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  cloud_functions: ^6.0.0
  flutter_local_notifications: ^22.2.0
  audioplayers: ^6.1.0

  # ===========================================================================
  # State Management
  # ===========================================================================

  flutter_riverpod: ^3.4.2

  # ===========================================================================
  # Navigation
  # ===========================================================================

  go_router: ^17.3.0
  url_launcher: ^6.3.2

  # ===========================================================================
  # Google Maps
  # ===========================================================================

  # Pinned while the official Flutter wrapper is pre-1.0.
  # 0.10.0 / Android Nav SDK 7.7.0 collides with LiveKit's WebRTC
  # org.jni_zero classes. Keep the newest compatible pilot version.
  google_navigation_flutter: 0.9.2

  # Location
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  flutter_polyline_points: ^3.0.1

  # ===========================================================================
  # Networking
  # ===========================================================================

  http: ^1.6.0

  # ===========================================================================
  # Authentication
  # ===========================================================================

  google_sign_in: ^7.1.0
  flutter_secure_storage: ^10.3.1

  # ===========================================================================
  # Images
  # ===========================================================================

  image_picker: ^1.1.2
  image: ^4.9.1
  cached_network_image: ^3.4.1

  # ===========================================================================
  # Utilities
  # ===========================================================================

  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  logger: ^2.6.1
  shared_preferences: ^2.5.5

  # ===========================================================================
  # UI
  # ===========================================================================

  flutter_svg: ^2.2.0
  shimmer: ^3.0.0
  livekit_client: ^2.8.0

  # ===========================================================================
  # Permissions
  # ===========================================================================

  permission_handler: ^13.0.0

  # ===========================================================================
  # Connectivity
  # ===========================================================================

  connectivity_plus: ^7.0.0

  # ===========================================================================
  # Launcher Icon
  # ===========================================================================

  flutter_launcher_icons: ^0.14.4
  voltrike_core:
    path: rust_builder
  flutter_rust_bridge: 2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  device_info_plus: ^12.4.0

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/regionJson/psgc_index_v1.bin
    - assets/ringtones/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/appLogo.png
  min_sdk_android: 24
