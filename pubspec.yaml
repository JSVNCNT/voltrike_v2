name: voltrike_v2
description: "VolTrike - Clean Community Mobility"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ===========================================================================
  # Firebase
  # ===========================================================================

  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0

  # ===========================================================================
  # State Management
  # ===========================================================================

  flutter_riverpod: ^2.6.1

  # ===========================================================================
  # Navigation
  # ===========================================================================

  go_router: ^16.0.0

  # ===========================================================================
  # Google Maps
  # ===========================================================================

  google_maps_flutter: ^2.12.3
  google_maps_flutter_platform_interface: ^2.12.0

  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_polyline_points: ^3.0.1

  # ===========================================================================
  # Networking
  # ===========================================================================

  http: ^1.6.0

  # ===========================================================================
  # Authentication
  # ===========================================================================

  google_sign_in: ^7.1.0
  flutter_secure_storage: ^9.2.4

  # ===========================================================================
  # Images
  # ===========================================================================

  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # ===========================================================================
  # Utilities
  # ===========================================================================

  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  logger: ^2.6.1

  # ===========================================================================
  # UI
  # ===========================================================================

  flutter_svg: ^2.2.0
  shimmer: ^3.0.0

  # ===========================================================================
  # Permissions
  # ===========================================================================

  permission_handler: ^12.0.1

  # ===========================================================================
  # Connectivity
  # ===========================================================================

  connectivity_plus: ^7.0.0

  # ===========================================================================
  # Launcher Icon
  # ===========================================================================

  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/regionJson/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/appLogo.png
  min_sdk_android: 21