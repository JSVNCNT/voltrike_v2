<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VolTrike Splash Preview</title>
  <style>
    @font-face {
      font-family: "Poppins";
      src: url("../../assets/fonts/Poppins-Regular.ttf") format("truetype");
      font-weight: 400;
    }

    @font-face {
      font-family: "Poppins";
      src: url("../../assets/fonts/Poppins-Bold.ttf") format("truetype");
      font-weight: 700;
    }

    :root {
      color-scheme: dark;
      font-family: "Poppins", system-ui, sans-serif;
      background: #07191a;
      color: #f4fbfb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 28%, rgba(45, 212, 191, 0.12), transparent 30%),
        #07191a;
    }

    .preview-shell {
      display: grid;
      justify-items: center;
      gap: 16px;
      width: min(100%, 430px);
    }

    .phone-frame {
      position: relative;
      width: min(100%, 390px);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border: 1px solid rgba(168, 220, 217, 0.38);
      border-radius: 32px;
      background: linear-gradient(180deg, #023f40 0%, #042e30 100%);
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.34);
    }

    .splash-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 30px;
    }

    .brand-mark {
      position: relative;
      width: 230px;
      height: 210px;
      transform: scale(0.985);
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      inset: -30px;
      opacity: 0;
      background: radial-gradient(circle, rgba(83, 225, 210, 0.18), transparent 68%);
      animation: glow-in 320ms 1120ms ease-out forwards;
    }

    .logo-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .piece {
      opacity: 0;
      animation-name: assemble-piece;
      animation-duration: var(--duration);
      animation-delay: var(--delay);
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      animation-fill-mode: forwards;
      transform: translate(var(--offset-x), var(--offset-y)) rotate(var(--rotation)) scale(0.9);
    }

    .piece-one {
      --offset-x: -14px;
      --offset-y: -10px;
      --rotation: -3.15deg;
      --delay: 0ms;
      --duration: 600ms;
      clip-path: polygon(0 0, 62% 0, 53% 43%, 0 50%);
    }

    .piece-two {
      --offset-x: -16px;
      --offset-y: 8px;
      --rotation: 2.58deg;
      --delay: 160ms;
      --duration: 640ms;
      clip-path: polygon(0 42%, 45% 35%, 52% 100%, 0 100%);
    }

    .piece-three {
      --offset-x: 0;
      --offset-y: 15px;
      --rotation: -2deg;
      --delay: 320ms;
      --duration: 680ms;
      clip-path: polygon(40% 30%, 72% 26%, 68% 100%, 48% 100%);
    }

    .piece-four {
      --offset-x: 14px;
      --offset-y: -12px;
      --rotation: 3.44deg;
      --delay: 480ms;
      --duration: 640ms;
      clip-path: polygon(58% 0, 100% 0, 100% 60%, 65% 54%);
    }

    .piece-five {
      --offset-x: 17px;
      --offset-y: 10px;
      --rotation: -2.58deg;
      --delay: 640ms;
      --duration: 640ms;
      clip-path: polygon(62% 48%, 100% 42%, 100% 100%, 64% 100%);
    }

    .whole-logo {
      opacity: 0;
      animation: reveal-logo 320ms 1120ms ease-out forwards;
    }

    .brand-name,
    .brand-tagline,
    .loading-status {
      opacity: 0;
      transform: translateY(8px);
    }

    .brand-name {
      margin-top: -4px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 1.4px;
      animation: rise-in 320ms 1280ms ease-out forwards;
    }

    .brand-tagline {
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.74);
      font-size: 14px;
      letter-spacing: 1px;
      animation: rise-in 280ms 1440ms ease-out forwards;
    }

    .loading-status {
      display: grid;
      justify-items: center;
      gap: 13px;
      margin-top: 34px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
      animation: status-in 240ms 1600ms ease-out forwards;
    }

    .spinner {
      width: 23px;
      height: 23px;
      border: 2.25px solid rgba(255, 255, 255, 0.22);
      border-top-color: #6adbd0;
      border-radius: 50%;
      animation: spin 720ms linear infinite;
    }

    .preview-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 13px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(137, 222, 215, 0.55);
      border-radius: 999px;
      padding: 9px 16px;
      background: #0b5556;
      color: #f4fbfb;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #0d6666; }
    button:focus-visible { outline: 3px solid #69ddd2; outline-offset: 3px; }

    @keyframes assemble-piece {
      to { opacity: 1; transform: translate(0, 0) rotate(0) scale(1); }
    }

    @keyframes reveal-logo {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes glow-in {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes rise-in {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes status-in {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 420px) {
      body { padding: 12px; }
      .phone-frame { border-radius: 24px; }
      .brand-mark { width: 210px; height: 192px; }
    }
  </style>
</head>
<body>
  <main class="preview-shell">
    <section class="phone-frame" aria-label="Two-second VolTrike startup animation preview">
      <div class="splash-stage" id="splash-stage">
        <div class="brand-mark" aria-hidden="true">
          <img class="logo-layer piece piece-one" src="../../assets/images/VolTrikeLogo-Light.png" alt="">
          <img class="logo-layer piece piece-two" src="../../assets/images/VolTrikeLogo-Light.png" alt="">
          <img class="logo-layer piece piece-three" src="../../assets/images/VolTrikeLogo-Light.png" alt="">
          <img class="logo-layer piece piece-four" src="../../assets/images/VolTrikeLogo-Light.png" alt="">
          <img class="logo-layer piece piece-five" src="../../assets/images/VolTrikeLogo-Light.png" alt="">
          <img class="logo-layer whole-logo" src="../../assets/images/VolTrikeLogo-Light.png" alt="">
        </div>
        <div class="brand-name">VolTrike</div>
        <div class="brand-tagline">Clean Community Mobility</div>
        <div class="loading-status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span>Restoring your session…</span>
        </div>
      </div>
    </section>
    <div class="preview-actions">
      <button type="button" id="replay-button">Replay animation</button>
      <span>2.0-second app sequence</span>
    </div>
  </main>
  <script>
    let stage = document.getElementById('splash-stage');
    const replayButton = document.getElementById('replay-button');

    replayButton.addEventListener('click', () => {
      const replacement = stage.cloneNode(true);
      stage.replaceWith(replacement);
      replacement.id = 'splash-stage';
      stage = replacement;
    });
  </script>
</body>
</html>
