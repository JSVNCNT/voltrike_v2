openapi: 3.0.3
info:
  title: VolTrike V2 API
  version: 2.0.0
  description: >-
    Firebase-authenticated application API owned by Go, with public account
    recovery and separately hosted IAM-protected integration worker routes.
    App Check is optional for the private APK deployment.
servers:
  - url: https://voltrike-api-v2.example.invalid
security:
  - firebaseAuth: []
x-app-check-header: X-Firebase-AppCheck
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Service health.
  /ready:
    get:
      security: []
      responses:
        "200":
          description: Service readiness.
  /healthz:
    get:
      security: []
      responses:
        "200":
          description: Service health.
  /readyz:
    get:
      security: []
      responses:
        "200":
          description: Service readiness.
  /auth/password-reset:
    post:
      operationId: requestPasswordResetEmail
      summary: Request a branded Firebase password-reset link before sign-in.
      description: >-
        Uses the existing Brevo sender and Firebase-generated action links.
        Unknown accounts and requests within the resend cooldown receive the
        same accepted response. Provider failures remain retryable; clients
        can use Firebase Auth email as their established recovery fallback.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Recovery request accepted without revealing account existence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAccepted"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /events/outbox:
    post:
      operationId: processOutboxEvent
      summary: Receive a Firestore document-created binary CloudEvent.
      description: >-
        Registered only on the private GO_INTEGRATION_WORKER service. Cloud
        Run IAM requires the dedicated Eventarc invoker's Google ID token.
        The handler validates event source, type and outbox document subject
        and reloads the durable document rather than trusting payload fields.
        A disabled notification sender returns a retryable failure.
      servers:
        - url: https://voltrike-integrations.example.invalid
      security:
        - googleOidc: []
      parameters:
        - name: Ce-Id
          in: header
          required: true
          schema: {type: string, minLength: 1}
        - name: Ce-Type
          in: header
          required: true
          schema:
            type: string
            enum: [google.cloud.firestore.document.v1.created]
        - name: Ce-Source
          in: header
          required: true
          description: Must identify this project's default Firestore database.
          schema:
            type: string
            example: //firestore.googleapis.com/projects/voltrike-v2/databases/(default)
        - name: Ce-Subject
          in: header
          required: true
          schema:
            type: string
            pattern: '^documents/outbox/[^/]+$'
        - name: Ce-Specversion
          in: header
          schema: {type: string, example: "1.0"}
      requestBody:
        content:
          application/protobuf:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Durable event processing result, including already completed work.
        default:
          $ref: "#/components/responses/Error"
  /tasks/maintenance:
    post:
      operationId: runWorkerMaintenance
      summary: Run hosted maintenance and notification retry recovery.
      description: >-
        Registered only on the private GO_INTEGRATION_WORKER service. Cloud
        Scheduler calls this route once per minute with an OIDC token whose
        audience is the worker's base service URL. Cloud Run IAM enforces the
        dedicated Scheduler invoker identity. Notification retries run only
        when GO_NOTIFICATIONS_ENABLED=true.
      servers:
        - url: https://voltrike-integrations.example.invalid
      security:
        - googleOidc: []
      responses:
        "200":
          description: Maintenance result and optional notification retry results.
        default:
          $ref: "#/components/responses/Error"
  /api/v2/capabilities:
    get:
      responses:
        "200":
          description: Supported features.
  /api/v2/me:
    get:
      responses:
        "200":
          description: Authenticated identity.
  /api/v2/quotes:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: Signed, short-lived quote.
        default:
          $ref: "#/components/responses/Error"
  /api/v2/bookings:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingCommand"
      responses:
        "201":
          description: Created booking.
        default:
          $ref: "#/components/responses/Error"
  /api/v2/bookings/{bookingId}:
    get:
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Booking projection.
        default:
          $ref: "#/components/responses/Error"
  /api/v2/bookings/{bookingId}/commands:
    post:
      parameters:
        - $ref: "#/components/parameters/BookingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCommand"
      responses:
        "200":
          description: Transitioned booking.
        "412":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /api/v2/admin/bookings:
    get:
      operationId: listAdminBookings
      summary: List bookings for an authenticated administrator.
      parameters:
        - {name: cursor, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Booking page.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {type: object}}
                  nextCursor: {type: string}
  /api/v2/driver/sessions:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionCommand"
      responses:
        "201":
          description: Active driver session.
  /api/v2/driver/sessions/{sessionId}/heartbeat:
    post:
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Refreshed session lease.
  /api/v2/driver/sessions/{sessionId}/location:
    put:
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationSample"
      responses:
        "202":
          description: Accepted location sample.
  /api/v2/operations/{operation}:
    post:
      summary: Execute an explicitly whitelisted authenticated domain operation.
      description: >-
        Includes requestBrandedVerificationEmail, syncMyEmailVerification,
        registerAdminWebPushToken and unregisterAdminWebPushToken. Verification
        returns data.sent and data.alreadyVerified. Push registration returns
        data.registered and data.deviceId. These use the same Firebase identity,
        authorization, command envelope and stable errors as other Go operations.
      parameters:
        - name: operation
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationCommand"
      responses:
        "200":
          description: Operation result.
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Stable API error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: FirebaseIDToken
    googleOidc:
      type: http
      scheme: bearer
      bearerFormat: GoogleIDToken
      description: Cloud Run IAM validates the configured service-account invoker.
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
  schemas:
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    PasswordResetAccepted:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [accepted]
          properties:
            accepted: {type: boolean, enum: [true]}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_argument, unauthenticated, permission_denied, not_found, conflict, failed_precondition, resource_exhausted, unavailable, deadline_exceeded, unimplemented, internal]
            message: {type: string}
            requestId: {type: string}
    OperationCommand:
      type: object
      required: [payload]
      properties:
        commandId: {type: string}
        payload: {type: object, additionalProperties: true}
    Coordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
    QuoteRequest:
      type: object
      required: [pickup, destination, additionalPassengers, baggageCount]
      properties:
        pickup: {$ref: "#/components/schemas/Coordinate"}
        destination: {$ref: "#/components/schemas/Coordinate"}
        additionalPassengers: {type: integer, minimum: 0, maximum: 3}
        baggageCount: {type: integer, minimum: 0, maximum: 1}
    CommandEnvelope:
      type: object
      required: [commandId]
      properties:
        commandId: {type: string}
        expectedRevision: {type: integer, minimum: 1}
        sessionId: {type: string}
        deviceId: {type: string}
    CreateBookingCommand:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          required: [bookingId, pickup, destination, quoteToken]
          properties:
            bookingId: {type: string}
            pickup: {$ref: "#/components/schemas/Coordinate"}
            destination: {$ref: "#/components/schemas/Coordinate"}
            pickupAddress: {type: string}
            destinationAddress: {type: string}
            additionalPassengers: {type: integer, minimum: 0, maximum: 3}
            baggageCount: {type: integer, minimum: 0, maximum: 1}
            quoteToken: {type: string}
    BookingCommand:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          required: [action]
          properties:
            action:
              type: string
              enum: [accept, arrived, start, payment, complete, cancel, noShow, decline, dispute, receipt]
            reasonCode: {type: string}
            reasonDetail: {type: string}
    CreateSessionCommand:
      type: object
      required: [sessionId, deviceId, platform, appVersion]
      properties:
        sessionId: {type: string}
        deviceId: {type: string}
        platform: {type: string}
        appVersion: {type: string}
        takeover: {type: boolean}
    LocationSample:
      type: object
      required: [leaseGeneration, sampleSequence, latitude, longitude, accuracy]
      properties:
        leaseGeneration: {type: integer, minimum: 1}
        sampleSequence: {type: integer, minimum: 1}
        latitude: {type: number}
        longitude: {type: number}
        accuracy: {type: number, minimum: 0, maximum: 500}
        observedAt: {type: string, format: date-time}
        online: {type: boolean}
        available: {type: boolean}
        todaId: {type: string}
