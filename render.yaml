services:
  - type: web
    name: voltrike-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_VOLTRIKE_API_BASE_URL
        value: https://voltrike-api-v2-327670792817.asia-southeast1.run.app
      - key: VITE_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false
      - key: VITE_FIREBASE_APP_CHECK_SITE_KEY
        sync: false
      - key: VITE_SENTRY_DSN
        value: https://ab6a0d4fa7707d4d12a2775605c1d297@o4511869752836096.ingest.us.sentry.io/4511869831413761
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
      - key: VITE_SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"
      - key: SENTRY_ORG
        value: voltrike
      - key: SENTRY_PROJECT
        value: voltrike-admin
      - key: SENTRY_AUTH_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
