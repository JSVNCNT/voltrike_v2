services:
  - type: web
    name: voltrike-admin
    runtime: static
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_VOLTRIKE_API_BASE_URL
        value: https://voltrike-api-v2-327670792817.asia-southeast1.run.app
      - key: VITE_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false
      - key: VITE_FIREBASE_APP_CHECK_SITE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
