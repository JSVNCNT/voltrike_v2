// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.voltrike_core'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.voltrike_core'
    }

    // Match the host app's current Flutter/Android toolchain. API 36 is also
    // required by transitive AndroidX dependencies in this project.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 24
        ndk {
            // The product supports low-end ARMv7, modern ARM64, and the
            // x86_64 emulator. Legacy 32-bit x86 has no Flutter runtime here.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../../rust"
    libname = "voltrike_core"
}
